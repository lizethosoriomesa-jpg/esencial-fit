<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESSENCIAL FIT COLOMBIA - ERP & POS</title>
  
  <!-- Tailwind CSS para Diseño Premium -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Fuentes Modernas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- React y ReactDOM CDNs (Librerías de ejecución) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel para compilar JSX en vivo en el navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase SDK para Sincronización en la Nube -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    /* Animación personalizada de desvanecimiento */
    .animate-fadeIn {
      animation: fadeIn 0.3s ease-out forwards;
    }
    .animate-scaleUp {
      animation: scaleUp 0.25s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleUp {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    /* Estilos para impresión de recibo térmico */
    @media print {
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        max-width: 80mm; /* Formato estándar de ticket térmico */
        font-family: monospace;
        color: #000;
      }
      .print\:hidden {
        display: none !important;
      }
    }
  </style>
</head>
<body class="h-full text-slate-100 selection:bg-blue-600 selection:text-white">

  <div id="root"></div>

  <!-- CÓDIGO INTERACTIVO DE LA APLICACIÓN -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ==========================================
    // ICONOS SVG OFFLINE-COMPATIBLES
    // Diseñados de forma nativa para no depender de llamadas externas
    // Se corrigen los fragmentos adyacentes de JSX envolviéndolos de forma segura.
    // ==========================================
    const Icon = ({ name, className = "w-5 h-5" }) => {
      const icons = {
        TrendingUp: <path d="m22 7-6 6-4-4-8 8M22 7h-6M22 7v6" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        Package: <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16zM3.27 6.96L12 12.01l8.73-5.05M12 22.08V12" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        Users: <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM17 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        History: <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5M12 7v5l4 2" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        Settings: <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        Plus: <path d="M12 5v14M5 12h14" strokeWidth="2" strokeLinecap="round"/>,
        Search: <g><circle cx="11" cy="11" r="8" strokeWidth="2"/><path d="m21 21-4.3-4.3" strokeWidth="2" strokeLinecap="round"/></g>,
        Trash2: <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2M10 11v6M14 11v6" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        RotateCcw: <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        Download: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        Upload: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        DollarSign: <g><line x1="12" y1="1" x2="12" y2="23" strokeWidth="2" strokeLinecap="round"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></g>,
        CheckCircle: <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14M22 4 12 14.01l-3-3" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        AlertTriangle: <g><path d="m10.29 3.86 7.3 12.62a1 1 0 0 1-.86 1.52H3.27a1 1 0 0 1-.86-1.52l7.3-12.62a1 1 0 0 1 1.58 0z" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/><path d="M12 9v4M12 17h.01" strokeWidth="2" strokeLinecap="round"/></g>,
        ShoppingCart: <g><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></g>,
        Printer: <path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        X: <path d="M18 6 6 18M6 6l12 12" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        FileText: <g><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/><polyline points="14 2 14 8 20 8" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></g>
      };

      return (
        <svg 
          className={className} 
          viewBox="0 0 24 24" 
          fill="none" 
          stroke="currentColor" 
          xmlns="http://www.w3.org/2000/svg"
        >
          {icons[name] || <circle cx="12" cy="12" r="10" strokeWidth="2"/>}
        </svg>
      );
    };

    // ==========================================
    // LOGO OFICIAL VECTORIAL
    // ==========================================
    const EssencialFitLogo = ({ className = "w-12 h-12" }) => (
      <svg className={className} viewBox="0 0 200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor="#3b82f6" />
            <stop offset="50%" stopColor="#1d4ed8" />
            <stop offset="100%" stopColor="#1e3a8a" />
          </linearGradient>
          <linearGradient id="silverGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stopColor="#94a3b8" />
            <stop offset="50%" stopColor="#f1f5f9" />
            <stop offset="100%" stopColor="#cbd5e1" />
          </linearGradient>
          <linearGradient id="neonGlow" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stopColor="#60a5fa" stopOpacity="0.8"/>
            <stop offset="100%" stopColor="#1d4ed8" stopOpacity="0.2"/>
          </linearGradient>
        </defs>
        <circle cx="100" cy="110" r="85" fill="url(#neonGlow)" />
        <circle cx="100" cy="110" r="75" stroke="url(#silverGrad)" strokeWidth="6" fill="#0f172a" />
        <circle cx="100" cy="110" r="68" stroke="url(#blueGrad)" strokeWidth="3" fill="none" />
        <path d="M124 74C124 70.5 121 68 117.5 68C114 68 111 71.5 111 75C111 78.5 113.5 80.5 117.5 80.5C121.5 80.5 124 77.5 124 74Z" fill="url(#silverGrad)" />
        <path d="M123.5 76C125 76.5 127 78 128 79.5L129 82C129.5 83 128.5 84 127.5 83.5L125 82.5L124 81" stroke="url(#silverGrad)" strokeWidth="1.5" strokeLinecap="round" />
        <path d="M124 84C131 82 142 85 149 92C155 97.5 158 105 157.5 113C157 119.5 152 125 146.5 126.5C141 128 135 123 133 120.5C129.5 116 128 111 128 111C128 111 126.5 113 124.5 115" fill="url(#blueGrad)" stroke="url(#silverGrad)" strokeWidth="2.5" />
        <path d="M140.5 95C145.5 98.5 148.5 104.5 148 111.5" stroke="url(#silverGrad)" strokeWidth="2.5" strokeLinecap="round" />
        <path d="M136 84.5C135 81.5 137 79 140 79.5C143 80 144 83 142.5 85.5C141.5 87 138 86.5 136 84.5Z" fill="url(#silverGrad)" />
        <path d="M96 116C103.5 111.5 113.5 110.5 121.5 114C128.5 117 129.5 124 128.5 130C127 139 123 147 121 156.5C116 156.5 110.5 155 106 152.5C99 148.5 94.5 141.5 92.5 134.5C90.5 127.5 91.5 120 96 116Z" fill="url(#blueGrad)" stroke="url(#silverGrad)" strokeWidth="2.5" />
        <path d="M101.5 127.5C108.5 128 114.5 131 119.5 136M107.5 137.5C111.5 139 116 142 118 146.5" stroke="url(#silverGrad)" strokeWidth="2" strokeLinecap="round" />
        <path d="M91 117C84 117 76 121.5 72.5 127C68.5 133.5 67 141 68.5 148.5C69.5 154 73.5 159.5 79 160.5C82 161 84.5 157.5 85.5 154.5C87 150 86.5 142.5 86.5 142.5" fill="url(#blueGrad)" stroke="url(#silverGrad)" strokeWidth="2.5" />
        <path d="M106.5 153C106 157.5 104.5 167.5 103 175.5M113 154C112 159.5 110.5 168.5 108.5 176" stroke="url(#silverGrad)" strokeWidth="2" strokeLinecap="round" />
        <path d="M100 225L125 180H75L100 225Z" fill="url(#blueGrad)" stroke="url(#silverGrad)" strokeWidth="3" strokeLinejoin="round" />
        <path d="M100 225V180" stroke="url(#silverGrad)" strokeWidth="2.5" />
        <path d="M100 225L110 180M100 225L90 180" stroke="#94a3b8" strokeWidth="1.5" />
      </svg>
    );

    // ==========================================
    // COMPONENTE PRINCIPAL
    // ==========================================
    function App() {
      // ------------------------------------------
      // ESTADOS DEL SISTEMA
      // ------------------------------------------
      const [products, setProducts] = useState([]);
      const [sales, setSales] = useState([]);
      const [credits, setCredits] = useState([]);
      const [syncStatus, setSyncStatus] = useState('local'); // 'local' | 'cloud'
      const [activeTab, setActiveTab] = useState('dashboard');

      // Parámetros de la Tienda
      const [storeName, setStoreName] = useState('ESSENCIAL FIT COLOMBIA');
      const [currencySymbol, setCurrencySymbol] = useState('$');
      const [paymentInstructions, setPaymentInstructions] = useState('Nequi: 300 123 4567 | Bancolombia Ahorros: 123-456789-01');

      // Modales y Alertas
      const [alertMessage, setAlertMessage] = useState(null);
      const [showInvoice, setShowInvoice] = useState(null);

      // Formularios de Creación / Edición
      const [productForm, setProductForm] = useState({
        id: '', name: '', brand: '', category: 'Proteínas', costPrice: 0, salePrice: 0, stock: 0, minStock: 5
      });
      const [isEditingProduct, setIsEditingProduct] = useState(false);
      const [showProductModal, setShowProductModal] = useState(false);

      // Terminal POS
      const [posCart, setPosCart] = useState([]);
      const [posCustomer, setPosCustomer] = useState('');
      const [posCustomerPhone, setPosCustomerPhone] = useState('');
      const [posPaymentMethod, setPosPaymentMethod] = useState('Efectivo');
      const [posSearchQuery, setPosSearchQuery] = useState('');
      const [posCategoryFilter, setPosCategoryFilter] = useState('Todos');

      // Inventario Filtros
      const [invSearchQuery, setInvSearchQuery] = useState('');
      const [invCategoryFilter, setInvCategoryFilter] = useState('Todos');

      // Deudas
      const [selectedDebtor, setSelectedDebtor] = useState(null);
      const [abonoAmount, setAbonoAmount] = useState('');
      const [abonoMethod, setAbonoMethod] = useState('Nequi');

      const categories = ['Proteínas', 'Creatinas', 'Pre-Entrenos', 'Aminoácidos', 'Quemadores', 'Salud/Vitaminas', 'Accesorios', 'Otros'];

      // ------------------------------------------
      // INICIALIZACIÓN Y PERSISTENCIA (LOCALSTORAGE)
      // ------------------------------------------
      useEffect(() => {
        loadLocalStorageData();
      }, []);

      const loadLocalStorageData = () => {
        try {
          const localProducts = localStorage.getItem('essencial_products');
          const localSales = localStorage.getItem('essencial_sales');
          const localCredits = localStorage.getItem('essencial_credits');
          const localStoreSettings = localStorage.getItem('essencial_settings');

          if (localProducts) setProducts(JSON.parse(localProducts));
          else setProducts(getMockProducts());

          if (localSales) setSales(JSON.parse(localSales));
          if (localCredits) setCredits(JSON.parse(localCredits));

          if (localStoreSettings) {
            const settings = JSON.parse(localStoreSettings);
            if (settings.storeName) setStoreName(settings.storeName);
            if (settings.currencySymbol) setCurrencySymbol(settings.currencySymbol);
            if (settings.paymentInstructions) setPaymentInstructions(settings.paymentInstructions);
          }
        } catch (e) {
          console.error("Error cargando LocalStorage:", e);
        }
      };

      const saveToLocalStorage = (key, data) => {
        try {
          localStorage.setItem(key, JSON.stringify(data));
        } catch (e) {
          console.error("Error guardando en LocalStorage:", e);
        }
      };

      const triggerAlert = (msg) => {
        setAlertMessage(msg);
        setTimeout(() => setAlertMessage(null), 3000);
      };

      const formatCurrency = (val) => {
        const number = Number(val) || 0;
        return `${currencySymbol} ${number.toLocaleString('es-CO', { minimumFractionDigits: 0, maximumFractionDigits: 0 })}`;
      };

      // Datos predeterminados iniciales
      function getMockProducts() {
        return [
          { id: '1', name: 'Smart Gainer 3.25 Lb', brand: 'ProScience', category: 'Proteínas', costPrice: 95000, salePrice: 135000, stock: 12, minStock: 3 },
          { id: '2', name: 'Best Protein 2.05 Lb', brand: 'ProScience', category: 'Proteínas', costPrice: 130000, salePrice: 175000, stock: 8, minStock: 3 },
          { id: '3', name: 'Creatina Legacy 300g', brand: 'ProScience', category: 'Creatinas', costPrice: 78000, salePrice: 110000, stock: 15, minStock: 4 },
          { id: '4', name: 'Psychotic Pre-Workout', brand: 'Insane Labz', category: 'Pre-Entrenos', costPrice: 85000, salePrice: 120000, stock: 4, minStock: 5 }
        ];
      }

      // ------------------------------------------
      // GESTIÓN DE PRODUCTOS (INVENTARIO)
      // ------------------------------------------
      const handleSaveProduct = (e) => {
        e.preventDefault();
        if (!productForm.name || productForm.salePrice <= 0) {
          triggerAlert("El nombre es obligatorio y el precio de venta debe ser mayor a 0.");
          return;
        }

        const payload = {
          name: productForm.name,
          brand: productForm.brand || 'Genérico',
          category: productForm.category,
          costPrice: Number(productForm.costPrice) || 0,
          salePrice: Number(productForm.salePrice) || 0,
          stock: Number(productForm.stock) || 0,
          minStock: Number(productForm.minStock) || 3
        };

        let updatedProducts = [...products];
        if (isEditingProduct) {
          updatedProducts = products.map(p => p.id === productForm.id ? { ...p, ...payload } : p);
        } else {
          const newProduct = { id: Date.now().toString(), ...payload };
          updatedProducts.push(newProduct);
        }

        setProducts(updatedProducts);
        saveToLocalStorage('essencial_products', updatedProducts);
        triggerAlert(isEditingProduct ? "Producto actualizado." : "Producto agregado.");

        setProductForm({ id: '', name: '', brand: '', category: 'Proteínas', costPrice: 0, salePrice: 0, stock: 0, minStock: 5 });
        setIsEditingProduct(false);
        setShowProductModal(false);
      };

      const handleEditProductClick = (product) => {
        setProductForm(product);
        setIsEditingProduct(true);
        setShowProductModal(true);
      };

      const handleDeleteProduct = (id) => {
        if (!window.confirm("¿Seguro que deseas eliminar este producto permanentemente?")) return;
        const updatedProducts = products.filter(p => p.id !== id);
        setProducts(updatedProducts);
        saveToLocalStorage('essencial_products', updatedProducts);
        triggerAlert("Producto eliminado.");
      };

      // ------------------------------------------
      // TERMINAL DE VENTAS (POS)
      // ------------------------------------------
      const handleAddToCart = (product) => {
        const existingIndex = posCart.findIndex(item => item.id === product.id);
        if (existingIndex > -1) {
          const updatedCart = [...posCart];
          updatedCart[existingIndex].quantity += 1;
          setPosCart(updatedCart);
        } else {
          setPosCart([...posCart, { ...product, quantity: 1 }]);
        }
      };

      const handleUpdateCartQuantity = (id, newQty) => {
        if (newQty <= 0) {
          setPosCart(posCart.filter(item => item.id !== id));
          return;
        }
        setPosCart(posCart.map(item => item.id === id ? { ...item, quantity: newQty } : item));
      };

      const handleRemoveFromCart = (id) => {
        setPosCart(posCart.filter(item => item.id !== id));
      };

      const cartTotal = useMemo(() => {
        return posCart.reduce((sum, item) => sum + (item.salePrice * item.quantity), 0);
      }, [posCart]);

      const handleProcessSale = () => {
        if (posCart.length === 0) {
          triggerAlert("El carrito está vacío.");
          return;
        }

        if (posPaymentMethod === 'Crédito' && !posCustomer.trim()) {
          triggerAlert("Para ventas a Crédito (Fiado) debes ingresar el nombre del cliente.");
          return;
        }

        const saleId = 'V-' + Date.now().toString().slice(-6);
        const timestamp = Date.now();

        const saleItems = posCart.map(item => ({
          id: item.id,
          name: item.name,
          brand: item.brand,
          quantity: item.quantity,
          costPrice: item.costPrice,
          salePrice: item.salePrice,
          total: item.quantity * item.salePrice
        }));

        const salePayload = {
          id: saleId,
          timestamp,
          items: saleItems,
          total: cartTotal,
          paymentMethod: posPaymentMethod,
          customerName: posCustomer.trim() || 'Público General',
          customerPhone: posCustomerPhone.trim() || ''
        };

        // Reducir stock
        const updatedProducts = products.map(prod => {
          const cartItem = posCart.find(item => item.id === prod.id);
          if (cartItem) {
            return { ...prod, stock: Math.max(0, prod.stock - cartItem.quantity) };
          }
          return prod;
        });

        // Registrar venta
        const newSalesList = [salePayload, ...sales];
        setSales(newSalesList);
        saveToLocalStorage('essencial_sales', newSalesList);

        // Guardar stock
        setProducts(updatedProducts);
        saveToLocalStorage('essencial_products', updatedProducts);

        // Si es a Crédito
        if (posPaymentMethod === 'Crédito') {
          const customerKey = posCustomer.trim().toLowerCase();
          let updatedCredits = [...credits];
          const debtorIndex = credits.findIndex(c => c.clientName.toLowerCase() === customerKey);

          if (debtorIndex > -1) {
            updatedCredits[debtorIndex].remainingDebt += cartTotal;
            updatedCredits[debtorIndex].totalDebt += cartTotal;
            updatedCredits[debtorIndex].salesList.push({ saleId, total: cartTotal, date: timestamp });
          } else {
            updatedCredits.push({
              id: Date.now().toString(),
              clientName: posCustomer.trim(),
              clientPhone: posCustomerPhone.trim(),
              totalDebt: cartTotal,
              remainingDebt: cartTotal,
              salesList: [{ saleId, total: cartTotal, date: timestamp }],
              paymentsList: []
            });
          }
          setCredits(updatedCredits);
          saveToLocalStorage('essencial_credits', updatedCredits);
        }

        triggerAlert("Venta registrada.");
        setShowInvoice(salePayload);

        // Limpieza de formulario POS
        setPosCart([]);
        setPosCustomer('');
        setPosCustomerPhone('');
        setPosPaymentMethod('Efectivo');
      };

      // ------------------------------------------
      // REGISTRAR ABONOS (CRÉDITOS)
      // ------------------------------------------
      const handleRegisterAbono = (e) => {
        e.preventDefault();
        const amount = Number(abonoAmount);
        if (!selectedDebtor) return;
        if (amount <= 0 || amount > selectedDebtor.remainingDebt) {
          triggerAlert("Monto no válido o supera la deuda.");
          return;
        }

        const timestamp = Date.now();
        const abonoItem = {
          amount,
          date: timestamp,
          paymentMethod: abonoMethod
        };

        const newRemainingDebt = selectedDebtor.remainingDebt - amount;
        const updatedPayments = [...selectedDebtor.paymentsList, abonoItem];

        const updatedCredits = credits.map(c => {
          if (c.id === selectedDebtor.id) {
            return { ...c, remainingDebt: newRemainingDebt, paymentsList: updatedPayments };
          }
          return c;
        });

        // Sumar abono como "Venta/Entrada de dinero"
        const abonoSaleId = 'AB-' + Date.now().toString().slice(-6);
        const abonoSalePayload = {
          id: abonoSaleId,
          timestamp,
          items: [{
            id: 'abono',
            name: `Abono Deuda - ${selectedDebtor.clientName}`,
            brand: 'Abono',
            quantity: 1,
            costPrice: 0,
            salePrice: amount,
            total: amount
          }],
          total: amount,
          paymentMethod: abonoMethod,
          customerName: selectedDebtor.clientName,
          customerPhone: selectedDebtor.clientPhone || '',
          isAbono: true
        };

        setCredits(updatedCredits);
        saveToLocalStorage('essencial_credits', updatedCredits);

        const newSalesList = [abonoSalePayload, ...sales];
        setSales(newSalesList);
        saveToLocalStorage('essencial_sales', newSalesList);

        triggerAlert(`Abono de ${formatCurrency(amount)} aplicado.`);
        setAbonoAmount('');
        setSelectedDebtor(null);
      };

      // ------------------------------------------
      // ANULAR TRANSACCIÓN
      // ------------------------------------------
      const handleVoidSale = (sale) => {
        if (!window.confirm(`¿Seguro que deseas anular la venta ${sale.id}? Se restaurará el stock.`)) return;

        // Restaurar stock
        const restoredProducts = products.map(prod => {
          const soldItem = sale.items.find(item => item.id === prod.id);
          if (soldItem && prod.id !== 'abono') {
            return { ...prod, stock: prod.stock + soldItem.quantity };
          }
          return prod;
        });

        const filteredSales = sales.filter(s => s.id !== sale.id);
        setSales(filteredSales);
        saveToLocalStorage('essencial_sales', filteredSales);

        setProducts(restoredProducts);
        saveToLocalStorage('essencial_products', restoredProducts);

        if (sale.paymentMethod === 'Crédito') {
          const debtorIndex = credits.findIndex(c => c.clientName.toLowerCase() === sale.customerName.toLowerCase());
          if (debtorIndex > -1) {
            const debtor = credits[debtorIndex];
            const updatedSalesList = debtor.salesList.filter(s => s.saleId !== sale.id);
            const newRemaining = Math.max(0, debtor.remainingDebt - sale.total);
            const newTotalDebt = Math.max(0, debtor.totalDebt - sale.total);

            let updatedCredits = [...credits];
            if (newRemaining === 0 && updatedSalesList.length === 0) {
              updatedCredits = credits.filter(c => c.id !== debtor.id);
            } else {
              updatedCredits[debtorIndex] = {
                ...debtor,
                remainingDebt: newRemaining,
                totalDebt: newTotalDebt,
                salesList: updatedSalesList
              };
            }
            setCredits(updatedCredits);
            saveToLocalStorage('essencial_credits', updatedCredits);
          }
        }

        triggerAlert("Transacción anulada.");
      };

      // ------------------------------------------
      // EXPORTAR / IMPORTAR RESPALDOS (COMPATIBLE CON DRIVE)
      // ------------------------------------------
      const handleExportData = () => {
        const backupData = {
          products, sales, credits,
          settings: { storeName, currencySymbol, paymentInstructions },
          exportDate: new Date().toISOString()
        };

        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `Respaldos_EssencialFit_${new Date().toISOString().slice(0, 10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();

        triggerAlert("Copia descargada. Súbela a tu Google Drive.");
      };

      const handleImportData = (e) => {
        const fileReader = new FileReader();
        const file = e.target.files[0];
        if (!file) return;

        fileReader.onload = (event) => {
          try {
            const parsedData = JSON.parse(event.target.result);
            if (!parsedData.products || !parsedData.sales || !parsedData.credits) {
              triggerAlert("Archivo no válido para este ERP.");
              return;
            }

            if (window.confirm("¿Restaurar copia de seguridad? Se sobrescribirá el stock de suplementos actual.")) {
              setProducts(parsedData.products);
              setSales(parsedData.sales);
              setCredits(parsedData.credits);
              if (parsedData.settings) {
                if (parsedData.settings.storeName) setStoreName(parsedData.settings.storeName);
                if (parsedData.settings.currencySymbol) setCurrencySymbol(parsedData.settings.currencySymbol);
                if (parsedData.settings.paymentInstructions) setPaymentInstructions(parsedData.settings.paymentInstructions);
              }

              saveToLocalStorage('essencial_products', parsedData.products);
              saveToLocalStorage('essencial_sales', parsedData.sales);
              saveToLocalStorage('essencial_credits', parsedData.credits);
              if (parsedData.settings) saveToLocalStorage('essencial_settings', parsedData.settings);

              triggerAlert("Sistema restaurado con éxito.");
            }
          } catch (err) {
            triggerAlert("Error al leer el archivo JSON.");
          }
        };
        fileReader.readAsText(file);
      };

      const handleSaveSettings = (e) => {
        e.preventDefault();
        const settingsPayload = { storeName, currencySymbol, paymentInstructions };
        saveToLocalStorage('essencial_settings', settingsPayload);
        triggerAlert("Ajustes guardados localmente.");
      };

      // ------------------------------------------
      // CÁLCULO DE METRICAS (DASHBOARD)
      // ------------------------------------------
      const stats = useMemo(() => {
        const totalVentas = sales.reduce((sum, s) => sum + s.total, 0);
        const totalInversion = products.reduce((sum, p) => sum + (p.costPrice * p.stock), 0);
        const valorVentaInventario = products.reduce((sum, p) => sum + (p.salePrice * p.stock), 0);
        const cuentasCobrar = credits.reduce((sum, c) => sum + c.remainingDebt, 0);
        const productosBajoStock = products.filter(p => p.stock <= p.minStock).length;

        return { totalVentas, totalInversion, valorVentaInventario, cuentasCobrar, productosBajoStock };
      }, [sales, products, credits]);

      // Filtrar catálogo de ventas POS
      const filteredPOSProducts = useMemo(() => {
        return products.filter(p => {
          const matchSearch = p.name.toLowerCase().includes(posSearchQuery.toLowerCase()) || 
                              p.brand.toLowerCase().includes(posSearchQuery.toLowerCase());
          const matchCategory = posCategoryFilter === 'Todos' || p.category === posCategoryFilter;
          return matchSearch && matchCategory;
        });
      }, [products, posSearchQuery, posCategoryFilter]);

      // Filtrar tabla de inventario
      const filteredInventoryProducts = useMemo(() => {
        return products.filter(p => {
          const matchSearch = p.name.toLowerCase().includes(invSearchQuery.toLowerCase()) || 
                              p.brand.toLowerCase().includes(invSearchQuery.toLowerCase());
          const matchCategory = invCategoryFilter === 'Todos' || p.category === invCategoryFilter;
          return matchSearch && matchCategory;
        });
      }, [products, invSearchQuery, invCategoryFilter]);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans flex flex-col">
          {/* Alertas */}
          {alertMessage && (
            <div className="fixed top-4 right-4 z-50 bg-blue-600 text-white font-medium px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3 animate-bounce border border-blue-400">
              <Icon name="CheckCircle" className="w-6 h-6" />
              <span>{alertMessage}</span>
            </div>
          )}

          {/* Header */}
          <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 backdrop-blur-md bg-opacity-95">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <EssencialFitLogo className="w-12 h-14" />
                <div>
                  <h1 className="text-xl sm:text-2xl font-black tracking-wider text-slate-50 flex items-center gap-1.5">
                    ESSENCIAL <span className="text-blue-500">FIT</span>
                  </h1>
                  <p className="text-xs font-semibold uppercase tracking-widest text-blue-400">COLOMBIA ERP</p>
                </div>
              </div>

              <div className="bg-emerald-950 text-emerald-400 border border-emerald-800 text-xs px-3 py-1.5 rounded-full font-bold flex items-center gap-1.5 shadow-sm">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                Offline OK
              </div>
            </div>

            {/* Menú */}
            <div className="border-t border-slate-800">
              <div className="max-w-7xl mx-auto px-4 overflow-x-auto">
                <nav className="flex space-x-1 py-1.5 min-w-[620px]">
                  <button onClick={() => setActiveTab('dashboard')} className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-semibold transition-all ${activeTab === 'dashboard' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}>
                    <Icon name="TrendingUp" className="w-4 h-4" /> Panel de Control
                  </button>
                  <button onClick={() => setActiveTab('pos')} className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-semibold transition-all ${activeTab === 'pos' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}>
                    <Icon name="ShoppingCart" className="w-4 h-4" /> Nueva Venta
                  </button>
                  <button onClick={() => setActiveTab('inventory')} className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-semibold transition-all ${activeTab === 'inventory' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}>
                    <Icon name="Package" className="w-4 h-4" /> Inventario
                  </button>
                  <button onClick={() => setActiveTab('debtors')} className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-semibold transition-all ${activeTab === 'debtors' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}>
                    <Icon name="Users" className="w-4 h-4" /> Cuentas por Cobrar
                  </button>
                  <button onClick={() => setActiveTab('history')} className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-semibold transition-all ${activeTab === 'history' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}>
                    <Icon name="History" className="w-4 h-4" /> Historial de Ventas
                  </button>
                  <button onClick={() => setActiveTab('settings')} className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-semibold transition-all ${activeTab === 'settings' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}>
                    <Icon name="Settings" className="w-4 h-4" /> Drive / Ajustes
                  </button>
                </nav>
              </div>
            </div>
          </header>

          <main className="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            
            {/* VIEW: DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div className="space-y-8 animate-fadeIn">
                <div className="bg-gradient-to-r from-blue-900/40 via-slate-900 to-slate-900 p-6 rounded-2xl border border-blue-900/50 flex flex-col md:flex-row items-center justify-between gap-6">
                  <div>
                    <h2 className="text-2xl font-black text-slate-100">¡Hola, bienvenido al sistema de Essencial Fit Colombia!</h2>
                    <p className="text-slate-400 mt-1 max-w-2xl">Control de stock, registro de ventas rápidas y administración de fiados de forma completamente local y rápida.</p>
                  </div>
                  <div className="flex gap-3 shrink-0">
                    <button onClick={() => setActiveTab('pos')} className="bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-3 rounded-xl flex items-center gap-2 transition-all">
                      <Icon name="ShoppingCart" className="w-5 h-5" /> Nueva Venta
                    </button>
                    <button onClick={() => { setShowProductModal(true); setIsEditingProduct(false); }} className="bg-slate-800 hover:bg-slate-700 text-slate-100 font-bold px-5 py-3 rounded-xl flex items-center gap-2 transition-all">
                      <Icon name="Plus" className="w-5 h-5" /> Agregar Suplemento
                    </button>
                  </div>
                </div>

                {/* Tarjetas de estadísticas */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                  <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 flex items-center justify-between shadow-xl">
                    <div>
                      <span className="text-xs font-bold uppercase tracking-wider text-slate-400">Ventas Registradas</span>
                      <h3 className="text-2xl font-black text-blue-400 mt-2">{formatCurrency(stats.totalVentas)}</h3>
                      <p className="text-xs text-slate-500 mt-1">Caja total acumulada</p>
                    </div>
                    <div className="bg-blue-950 p-4 rounded-xl border border-blue-900 text-blue-400">
                      <Icon name="DollarSign" className="w-6 h-6" />
                    </div>
                  </div>

                  <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 flex items-center justify-between shadow-xl">
                    <div>
                      <span className="text-xs font-bold uppercase tracking-wider text-slate-400">Inversión Stock</span>
                      <h3 className="text-2xl font-black text-slate-100 mt-2">{formatCurrency(stats.totalInversion)}</h3>
                      <p className="text-xs text-emerald-500 mt-1">Venta potencial: {formatCurrency(stats.valorVentaInventario)}</p>
                    </div>
                    <div className="bg-slate-800 p-4 rounded-xl text-slate-300">
                      <Icon name="Package" className="w-6 h-6" />
                    </div>
                  </div>

                  <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 flex items-center justify-between shadow-xl">
                    <div>
                      <span className="text-xs font-bold uppercase tracking-wider text-slate-400">Fiado / Por Cobrar</span>
                      <h3 className="text-2xl font-black text-red-400 mt-2">{formatCurrency(stats.cuentasCobrar)}</h3>
                      <p className="text-xs text-slate-500 mt-1">Saldos pendientes de clientes</p>
                    </div>
                    <div className="bg-red-950 p-4 rounded-xl border border-red-900 text-red-400">
                      <Icon name="Users" className="w-6 h-6" />
                    </div>
                  </div>

                  <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 flex items-center justify-between shadow-xl">
                    <div>
                      <span className="text-xs font-bold uppercase tracking-wider text-slate-400">Suplementos Bajos</span>
                      <h3 className="text-2xl font-black text-amber-500 mt-2">{stats.productosBajoStock} Uds</h3>
                      <p className="text-xs text-amber-400/80 mt-1">Requieren abastecimiento</p>
                    </div>
                    <div className="bg-amber-950 p-4 rounded-xl border border-amber-900 text-amber-500">
                      <Icon name="AlertTriangle" className="w-6 h-6" />
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                  {/* Stock Alertas */}
                  <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 flex flex-col h-[350px]">
                    <h3 className="text-lg font-black text-slate-200 mb-4 flex items-center gap-2">
                      <Icon name="AlertTriangle" className="text-amber-500 w-5 h-5" /> Niveles de Stock Críticos
                    </h3>
                    <div className="flex-grow overflow-y-auto space-y-3">
                      {products.filter(p => p.stock <= p.minStock).length === 0 ? (
                        <div className="h-full flex flex-col items-center justify-center text-slate-500">
                          <Icon name="CheckCircle" className="w-12 h-12 text-emerald-500 mb-2" />
                          <p className="text-sm">Todo el stock está en excelentes condiciones.</p>
                        </div>
                      ) : (
                        products.filter(p => p.stock <= p.minStock).map(p => (
                          <div key={p.id} className="bg-slate-950 p-4 rounded-xl border border-slate-850 flex items-center justify-between">
                            <div>
                              <p className="font-bold text-slate-200 text-sm">{p.name}</p>
                              <p className="text-xs text-slate-500">Marca: {p.brand} | Categoría: {p.category}</p>
                            </div>
                            <span className="bg-amber-950 text-amber-400 border border-amber-900 px-3 py-1 rounded-lg text-xs font-black">
                              {p.stock} Uds
                            </span>
                          </div>
                        ))
                      )}
                    </div>
                  </div>

                  {/* Últimas Ventas */}
                  <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 flex flex-col h-[350px]">
                    <h3 className="text-lg font-black text-slate-200 mb-4 flex items-center gap-2">
                      <Icon name="History" className="text-blue-500 w-5 h-5" /> Registro de Ventas Recientes
                    </h3>
                    <div className="flex-grow overflow-y-auto space-y-3">
                      {sales.length === 0 ? (
                        <div className="h-full flex flex-col items-center justify-center text-slate-500">
                          <Icon name="ShoppingCart" className="w-12 h-12 mb-2" />
                          <p className="text-sm">No has registrado transacciones hoy.</p>
                        </div>
                      ) : (
                        sales.slice(0, 5).map(sale => (
                          <div key={sale.id} className="bg-slate-950 p-4 rounded-xl border border-slate-850 flex items-center justify-between">
                            <div>
                              <p className="font-bold text-slate-200 text-sm">{sale.customerName} ({sale.id})</p>
                              <p className="text-xs text-slate-500">{new Date(sale.timestamp).toLocaleTimeString()}</p>
                            </div>
                            <span className="text-blue-400 font-black text-sm">{formatCurrency(sale.total)}</span>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* VIEW: POS */}
            {activeTab === 'pos' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 animate-fadeIn">
                {/* Catálogo */}
                <div className="lg:col-span-7 xl:col-span-8 space-y-6">
                  <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 flex flex-col sm:flex-row gap-3">
                    <div className="relative flex-grow">
                      <Icon name="Search" className="absolute left-3.5 top-3.5 text-slate-400 w-5 h-5" />
                      <input 
                        type="text" 
                        placeholder="Buscar por suplemento, marca..." 
                        value={posSearchQuery}
                        onChange={(e) => setPosSearchQuery(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 pl-11 pr-4 text-sm focus:outline-none focus:border-blue-600 text-slate-100"
                      />
                    </div>
                    <select 
                      value={posCategoryFilter}
                      onChange={(e) => setPosCategoryFilter(e.target.value)}
                      className="bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-blue-600 sm:w-48"
                    >
                      <option value="Todos">Todas las categorías</option>
                      {categories.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                    </select>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
                    {filteredPOSProducts.map(prod => (
                      <div key={prod.id} className="bg-slate-900 rounded-2xl border border-slate-800 p-5 flex flex-col justify-between hover:border-blue-500/50 transition-all">
                        <div>
                          <div className="flex justify-between items-center mb-2">
                            <span className="text-2xs bg-slate-800 px-2 py-0.5 rounded text-slate-300 font-bold uppercase">{prod.category}</span>
                            <span className="text-xs font-bold text-emerald-400">{prod.stock} Uds</span>
                          </div>
                          <h4 className="font-black text-slate-200 text-base">{prod.name}</h4>
                          <p className="text-xs text-slate-500 uppercase font-semibold">{prod.brand}</p>
                        </div>
                        <div className="mt-5 pt-4 border-t border-slate-800 flex items-center justify-between">
                          <div>
                            <p className="text-2xs text-slate-500">Precio</p>
                            <p className="text-base font-black text-blue-400">{formatCurrency(prod.salePrice)}</p>
                          </div>
                          <button onClick={() => handleAddToCart(prod)} className="bg-blue-600 hover:bg-blue-700 p-2 rounded-xl text-white">
                            <Icon name="Plus" className="w-5 h-5" />
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Carrito */}
                <div className="lg:col-span-5 xl:col-span-4">
                  <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 flex flex-col min-h-[450px]">
                    <h3 className="text-lg font-black pb-3 border-b border-slate-800 flex items-center gap-2">
                      <Icon name="ShoppingCart" className="text-blue-500" /> Carrito
                    </h3>

                    <div className="flex-grow space-y-3 my-4 max-h-[250px] overflow-y-auto">
                      {posCart.length === 0 ? (
                        <p className="text-xs text-slate-500 text-center py-12">Agrega suplementos al carrito</p>
                      ) : (
                        posCart.map(item => (
                          <div key={item.id} className="bg-slate-950 p-3 rounded-xl border border-slate-850 flex items-center justify-between">
                            <div className="min-w-0 flex-grow">
                              <p className="font-bold text-sm truncate">{item.name}</p>
                              <p className="text-xs text-blue-400 font-bold">{formatCurrency(item.salePrice)}</p>
                            </div>
                            <div className="flex items-center gap-2 shrink-0 ml-3">
                              <button onClick={() => handleUpdateCartQuantity(item.id, item.quantity - 1)} className="bg-slate-800 text-white w-6 h-6 rounded font-black text-xs">-</button>
                              <span className="text-sm font-bold">{item.quantity}</span>
                              <button onClick={() => handleUpdateCartQuantity(item.id, item.quantity + 1)} className="bg-slate-800 text-white w-6 h-6 rounded font-black text-xs">+</button>
                              <button onClick={() => handleRemoveFromCart(item.id)} className="text-red-500 ml-1"><Icon name="X" className="w-4 h-4" /></button>
                            </div>
                          </div>
                        ))
                      )}
                    </div>

                    <div className="border-t border-slate-800 pt-4 space-y-4">
                      <input 
                        type="text" 
                        placeholder="Nombre de Cliente" 
                        value={posCustomer}
                        onChange={(e) => setPosCustomer(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-100 placeholder-slate-650"
                      />
                      {posPaymentMethod === 'Crédito' && (
                        <input 
                          type="text" 
                          placeholder="Celular (Obligatorio para Créditos)" 
                          value={posCustomerPhone}
                          onChange={(e) => setPosCustomerPhone(e.target.value)}
                          className="w-full bg-slate-950 border border-red-900 rounded-lg p-2.5 text-xs text-slate-100 placeholder-slate-750"
                        />
                      )}
                      <select 
                        value={posPaymentMethod}
                        onChange={(e) => setPosPaymentMethod(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-100"
                      >
                        <option value="Efectivo">Efectivo</option>
                        <option value="Nequi">Nequi</option>
                        <option value="Daviplata">Daviplata</option>
                        <option value="Transferencia">Transferencia Bancolombia</option>
                        <option value="Tarjeta">Tarjeta de Crédito</option>
                        <option value="Crédito">Crédito (A Deuda / Fiado)</option>
                      </select>

                      <div className="flex justify-between items-center bg-slate-950 p-4 rounded-xl">
                        <span className="text-sm font-bold">TOTAL</span>
                        <span className="text-lg font-black text-blue-400">{formatCurrency(cartTotal)}</span>
                      </div>

                      <button onClick={handleProcessSale} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3 rounded-xl flex justify-center items-center gap-2">
                        <Icon name="CheckCircle" className="w-5 h-5" /> Procesar Transacción
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* VIEW: INVENTARIO */}
            {activeTab === 'inventory' && (
              <div className="space-y-6 animate-fadeIn">
                <div className="flex justify-between items-center bg-slate-900 p-6 rounded-2xl border border-slate-800">
                  <div>
                    <h3 className="text-xl font-black flex items-center gap-2"><Icon name="Package" className="text-blue-500" /> Inventario de Suplementos</h3>
                    <p className="text-xs text-slate-400 mt-1">Sube nuevo stock físico, modifica precios o agrega nuevas proteínas.</p>
                  </div>
                  <button onClick={() => { setShowProductModal(true); setIsEditingProduct(false); }} className="bg-blue-600 hover:bg-blue-700 px-4 py-2.5 rounded-xl font-bold text-xs">
                    + Registrar Suplemento
                  </button>
                </div>

                <div className="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden">
                  <div className="overflow-x-auto">
                    <table className="w-full text-left min-w-[700px]">
                      <thead>
                        <tr className="bg-slate-950 text-slate-400 text-xs uppercase font-bold tracking-wider border-b border-slate-800">
                          <th className="py-4 px-6">Producto</th>
                          <th className="py-4 px-6">Categoría</th>
                          <th className="py-4 px-6 text-right">Costo COP</th>
                          <th className="py-4 px-6 text-right">Venta COP</th>
                          <th className="py-4 px-6 text-center">Stock</th>
                          <th className="py-4 px-6 text-center">Acciones</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800">
                        {filteredInventoryProducts.map(prod => (
                          <tr key={prod.id} className="hover:bg-slate-850/50">
                            <td className="py-4 px-6">
                              <span className="font-bold text-slate-200 block">{prod.name}</span>
                              <span className="text-xs text-slate-500">{prod.brand}</span>
                            </td>
                            <td className="py-4 px-6"><span className="bg-slate-800 text-slate-300 text-xs px-2.5 py-1 rounded font-bold">{prod.category}</span></td>
                            <td className="py-4 px-6 text-right font-semibold text-slate-400">{formatCurrency(prod.costPrice)}</td>
                            <td className="py-4 px-6 text-right font-black text-blue-400">{formatCurrency(prod.salePrice)}</td>
                            <td className="py-4 px-6 text-center">
                              <span className={`px-2.5 py-1 rounded text-xs font-black ${prod.stock <= prod.minStock ? 'bg-amber-950 text-amber-500' : 'bg-slate-950 text-emerald-400'}`}>
                                {prod.stock} Uds
                              </span>
                            </td>
                            <td className="py-4 px-6 text-center">
                              <div className="flex justify-center gap-2">
                                <button onClick={() => handleEditProductClick(prod)} className="bg-slate-950 hover:bg-slate-800 p-2 rounded border border-slate-800 text-xs text-blue-400">Editar</button>
                                <button onClick={() => handleDeleteProduct(prod.id)} className="bg-slate-950 hover:bg-slate-800 p-2 rounded border border-slate-800 text-xs text-red-500"><Icon name="Trash2" className="w-4 h-4" /></button>
                              </div>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* VIEW: DEUDORES */}
            {activeTab === 'debtors' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 animate-fadeIn">
                <div className="lg:col-span-8 bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden">
                  <div className="p-5 border-b border-slate-800 flex justify-between items-center">
                    <h4 className="font-bold">Clientes con Deudas Pendientes</h4>
                    <span className="text-xs text-red-400 font-bold bg-red-950 px-3 py-1 rounded border border-red-900">Por Cobrar Total: {formatCurrency(stats.cuentasCobrar)}</span>
                  </div>
                  <div className="divide-y divide-slate-800">
                    {credits.length === 0 ? (
                      <p className="p-12 text-center text-slate-500 text-sm">Sin saldos en mora por cobrar.</p>
                    ) : (
                      credits.map(debtor => (
                        <div key={debtor.id} onClick={() => setSelectedDebtor(debtor)} className={`p-5 flex justify-between items-center hover:bg-slate-850/50 cursor-pointer ${selectedDebtor?.id === debtor.id ? 'bg-blue-950/20 border-l-4 border-l-blue-600' : ''}`}>
                          <div>
                            <h4 className="font-bold text-slate-100">{debtor.clientName}</h4>
                            <p className="text-xs text-slate-400">Cel: {debtor.clientPhone || 'No registrado'}</p>
                          </div>
                          <div className="text-right">
                            <p className="text-xs text-slate-500">Saldo Pendiente</p>
                            <p className="text-base font-black text-red-400">{formatCurrency(debtor.remainingDebt)}</p>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>

                <div className="lg:col-span-4">
                  <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
                    <h3 className="font-bold text-slate-200 flex items-center gap-2"><Icon name="DollarSign" className="text-blue-500" /> Operar Abono</h3>
                    {selectedDebtor ? (
                      <form onSubmit={handleRegisterAbono} className="space-y-4">
                        <p className="text-xs text-slate-400">Registrando abono para <span className="text-slate-200 font-bold block text-sm mt-1">{selectedDebtor.clientName}</span></p>
                        <div>
                          <label className="block text-2xs uppercase tracking-wider text-slate-400 mb-1">Monto (COP)</label>
                          <input type="number" required placeholder="Ej. 20000" value={abonoAmount} onChange={(e) => setAbonoAmount(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-100 font-bold" />
                        </div>
                        <div>
                          <label className="block text-2xs uppercase tracking-wider text-slate-400 mb-1">Método</label>
                          <select value={abonoMethod} onChange={(e) => setAbonoMethod(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-100">
                            <option value="Nequi">Nequi</option>
                            <option value="Daviplata">Daviplata</option>
                            <option value="Efectivo">Efectivo</option>
                            <option value="Transferencia">Bancolombia</option>
                          </select>
                        </div>
                        <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-xl text-xs">Aplicar Abono</button>
                      </form>
                    ) : (
                      <p className="text-xs text-slate-500 text-center py-12">Selecciona un deudor de la lista para registrar un abono.</p>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* VIEW: HISTORIAL */}
            {activeTab === 'history' && (
              <div className="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden animate-fadeIn">
                <div className="p-6 border-b border-slate-800">
                  <h3 className="text-xl font-black">Historial de Transacciones</h3>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-left min-w-[700px]">
                    <thead>
                      <tr className="bg-slate-950 text-slate-400 text-xs uppercase font-bold border-b border-slate-800">
                        <th className="py-4 px-6">Código / Fecha</th>
                        <th className="py-4 px-6">Cliente</th>
                        <th className="py-4 px-6">Método de Pago</th>
                        <th className="py-4 px-6 text-right">Total COP</th>
                        <th className="py-4 px-6 text-center">Acciones</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800">
                      {sales.map(sale => (
                        <tr key={sale.id} className="hover:bg-slate-850/50">
                          <td className="py-4 px-6 font-bold text-slate-200">
                            {sale.id}
                            <span className="text-2xs text-slate-500 block">{new Date(sale.timestamp).toLocaleString()}</span>
                          </td>
                          <td className="py-4 px-6 text-slate-300">{sale.customerName}</td>
                          <td className="py-4 px-6"><span className="bg-slate-800 text-slate-300 text-2xs px-2.5 py-1 rounded-full font-bold">{sale.paymentMethod}</span></td>
                          <td className="py-4 px-6 text-right font-black text-blue-400">{formatCurrency(sale.total)}</td>
                          <td className="py-4 px-6 text-center">
                            <div className="flex justify-center gap-2">
                              <button onClick={() => setShowInvoice(sale)} className="bg-slate-950 border border-slate-800 text-blue-400 text-xs px-2.5 py-1 rounded">Recibo</button>
                              <button onClick={() => handleVoidSale(sale)} className="bg-slate-950 border border-slate-800 text-red-500 text-xs px-2.5 py-1 rounded">Anular</button>
                            </div>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* VIEW: CONFIGURACIÓN */}
            {activeTab === 'settings' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-8 animate-fadeIn">
                <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
                  <h3 className="font-black text-lg flex items-center gap-2"><Icon name="Download" className="text-blue-500" /> Respaldos (Google Drive)</h3>
                  <p className="text-xs text-slate-400">Guarda copias de seguridad en tus carpetas compartidas de Google Drive.</p>
                  <button onClick={handleExportData} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-xs flex justify-center items-center gap-2">
                    <Icon name="Download" className="w-4 h-4" /> Exportar Copia de Seguridad
                  </button>

                  <div className="border-t border-slate-800 pt-4">
                    <label htmlFor="import-file" className="w-full bg-slate-950 border border-slate-800 text-slate-300 font-bold py-2.5 rounded-xl text-xs flex justify-center items-center gap-2 cursor-pointer hover:bg-slate-850">
                      <Icon name="Upload" className="w-4 h-4" /> Importar Archivo de Respaldo (.json)
                    </label>
                    <input type="file" accept=".json" id="import-file" onChange={handleImportData} className="hidden" />
                  </div>
                </div>

                <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
                  <h3 className="font-black text-lg flex items-center gap-2"><Icon name="Settings" className="text-blue-500" /> Datos del Negocio</h3>
                  <form onSubmit={handleSaveSettings} className="space-y-4">
                    <input type="text" required value={storeName} onChange={(e) => setStoreName(e.target.value)} placeholder="Nombre de la Tienda" className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-100" />
                    <input type="text" required value={currencySymbol} onChange={(e) => setCurrencySymbol(e.target.value)} placeholder="Símbolo de Moneda" className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-100" />
                    <textarea value={paymentInstructions} onChange={(e) => setPaymentInstructions(e.target.value)} placeholder="Datos bancarios para ticket..." rows="3" className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-100"></textarea>
                    <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-xl text-xs">Guardar Cambios</button>
                  </form>
                </div>
              </div>
            )}

          </main>

          {/* Modal Producto */}
          {showProductModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 rounded-2xl border border-slate-800 max-w-md w-full p-6 space-y-4 animate-scaleUp">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-black text-slate-200">{isEditingProduct ? 'Editar Suplemento' : 'Nuevo Suplemento'}</h3>
                  <button onClick={() => setShowProductModal(false)}><Icon name="X" /></button>
                </div>
                <form onSubmit={handleSaveProduct} className="space-y-4">
                  <input type="text" required placeholder="Nombre del Suplemento" value={productForm.name} onChange={(e) => setProductForm({ ...productForm, name: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-100" />
                  <div className="grid grid-cols-2 gap-4">
                    <input type="text" placeholder="Marca (ProScience, etc)" value={productForm.brand} onChange={(e) => setProductForm({ ...productForm, brand: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-100" />
                    <select value={productForm.category} onChange={(e) => setProductForm({ ...productForm, category: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-100">
                      {categories.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                    </select>
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <input type="number" required placeholder="Costo Unitario" value={productForm.costPrice || ''} onChange={(e) => setProductForm({ ...productForm, costPrice: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-100 font-bold" />
                    <input type="number" required placeholder="Precio de Venta" value={productForm.salePrice || ''} onChange={(e) => setProductForm({ ...productForm, salePrice: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-100 font-bold text-blue-400" />
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <input type="number" required placeholder="Stock Inicial" value={productForm.stock || ''} onChange={(e) => setProductForm({ ...productForm, stock: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-100" />
                    <input type="number" required placeholder="Stock Alerta Mínimo" value={productForm.minStock || ''} onChange={(e) => setProductForm({ ...productForm, minStock: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-100" />
                  </div>
                  <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-2.5 rounded-xl text-xs">Guardar Suplemento</button>
                </form>
              </div>
            </div>
          )}

          {/* Recibo modal */}
          {showInvoice && (
            <div className="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-white text-slate-900 rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-2xl relative animate-scaleUp">
                <button onClick={() => setShowInvoice(null)} className="absolute top-4 right-4 text-slate-500 hover:text-slate-800 print:hidden"><Icon name="X" /></button>
                <div id="print-area" className="space-y-4 text-center text-xs">
                  <div className="flex flex-col items-center">
                    <EssencialFitLogo className="w-16 h-16" />
                    <h3 className="font-black text-base uppercase tracking-wider text-slate-900 mt-2">{storeName}</h3>
                    <p className="text-3xs text-slate-500">{new Date(showInvoice.timestamp).toLocaleString()}</p>
                  </div>
                  <div className="border-t border-b border-dashed border-slate-300 py-2.5 text-left">
                    <p><span className="font-bold">Factura:</span> {showInvoice.id}</p>
                    <p><span className="font-bold">Cliente:</span> {showInvoice.customerName}</p>
                    <p><span className="font-bold">Medio:</span> {showInvoice.paymentMethod}</p>
                  </div>
                  <div className="text-left space-y-1">
                    {showInvoice.items.map((item, i) => (
                      <div key={i} className="flex justify-between text-3xs">
                        <span>{item.quantity}x {item.name}</span>
                        <span className="font-bold">{formatCurrency(item.salePrice * item.quantity)}</span>
                      </div>
                    ))}
                  </div>
                  <div className="border-t border-dashed border-slate-300 pt-2 flex justify-between font-black text-sm text-slate-900">
                    <span>Total:</span>
                    <span>{formatCurrency(showInvoice.total)}</span>
                  </div>
                  <p className="whitespace-pre-line text-3xs text-slate-500 leading-relaxed text-left bg-slate-50 p-2.5 rounded border border-slate-200 mt-2">{paymentInstructions}</p>
                  <p className="text-3xs text-slate-500 italic mt-4 text-center">¡Entrena fuerte, alcanza tu mejor versión!</p>
                </div>
                <div className="pt-2 flex gap-2 print:hidden">
                  <button onClick={() => window.print()} className="flex-grow bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-xs flex justify-center items-center gap-2">
                    <Icon name="Printer" className="w-4 h-4" /> Imprimir Recibo
                  </button>
                  <button onClick={() => setShowInvoice(null)} className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-4 py-2.5 rounded-xl text-xs">Cerrar</button>
                </div>
              </div>
            </div>
          )}

          <footer className="bg-slate-900 border-t border-slate-800 py-6 mt-12 text-center text-xs text-slate-500">
            <p>© {new Date().getFullYear()} Essencial Fit Colombia. Todos los derechos reservados.</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
