<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esencial Fit - Gestión Administrativa y Tienda</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

    <!-- Header / Navegación -->
    <nav class="bg-blue-900 text-white p-4 flex justify-between items-center shadow-lg">
        <h1 class="text-2xl font-bold cursor-pointer" onclick="showView('user')">Esencial Fit</h1>
        <div>
            <button onclick="showView('user')" class="px-4 py-2 hover:bg-blue-800 rounded">Tienda</button>
            <button onclick="showView('admin-login')" class="px-4 py-2 bg-blue-700 hover:bg-blue-600 rounded ml-2">Admin</button>
        </div>
    </nav>

    <!-- VISTA 1: Usuario (Tienda) -->
    <main id="user-view" class="p-8">
        <h2 class="text-3xl font-bold text-gray-800 mb-6">Nuestros Productos</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="product-grid">
            <!-- Los productos se cargarán aquí dinámicamente -->
            <div class="bg-white p-4 rounded-lg shadow border">
                <div class="h-48 bg-gray-200 mb-4 rounded"></div>
                <h3 class="font-bold text-lg">Producto Ejemplo</h3>
                <p class="text-blue-600 font-semibold">$99.00</p>
            </div>
        </div>
    </main>

    <!-- VISTA 2: Login Administrativo -->
    <section id="admin-login" class="hidden p-8 flex justify-center">
        <div class="bg-white p-8 rounded-xl shadow-xl w-full max-w-sm border border-gray-200">
            <h2 class="text-xl font-bold mb-4">Acceso Administrativo</h2>
            <input type="password" id="admin-pass" placeholder="Ingresa tu clave" class="w-full border p-2 mb-4 rounded">
            <button onclick="verifyAdmin()" class="w-full bg-blue-900 text-white py-2 rounded hover:bg-blue-800">Entrar al Panel</button>
        </div>
    </section>

    <!-- VISTA 3: Panel Administrativo -->
    <section id="admin-panel" class="hidden p-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold">Panel de Control Administrativo</h2>
            <button onclick="showView('user')" class="text-gray-500 hover:text-black">Salir del Panel</button>
        </div>
        <div class="bg-white p-6 rounded-lg shadow border">
            <h3 class="font-bold mb-4">Gestión de Inventario</h3>
            <button class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-500">+ Nuevo Producto</button>
            <div class="mt-4 border-t pt-4">
                <p class="text-gray-600">Aquí verás la lista de productos para editar o eliminar.</p>
            </div>
        </div>
    </section>

    <script>
        // Función para alternar vistas
        function showView(view) {
            document.getElementById('user-view').classList.add('hidden');
            document.getElementById('admin-login').classList.add('hidden');
            document.getElementById('admin-panel').classList.add('hidden');

            if (view === 'user') document.getElementById('user-view').classList.remove('hidden');
            if (view === 'admin-login') document.getElementById('admin-login').classList.remove('hidden');
            if (view === 'admin-panel') document.getElementById('admin-panel').classList.remove('hidden');
        }

        // Verificación simple de Admin
        function verifyAdmin() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === "admin123") { // Cambia esto por tu contraseña real
                showView('admin-panel');
            } else {
                alert("Contraseña incorrecta");
            }
        }
    </script>
</body>
</html>
